    Projects:
      - name: VectorOptimizationGroup
        summary: GitHub organization focused on software for multiobjective/vector optimization, with Julia packages for solvers, benchmark problems, and experimental evaluation.
        url: https://github.com/VectorOptimizationGroup
        highlights:
          - "Co-founder of the organization together with L. F. Prudente and Pedro Assuncao Filho."
          - "MOSolvers.jl: Julia package for multiobjective optimization solvers."
          - "MOProblems.jl: Julia package for benchmark problems in multiobjective optimization."
          - "MOMetrics.jl: Julia package for metrics and evaluation utilities for multiobjective optimization experiments."

    References:
      - name: Leandro F. Prudente
        icon: fa-solid fa-user
        reference: Associate Professor at the Institute of Mathematics and Statistics of the Federal University of Goias (UFG). His research interests include nonlinear programming, multiobjective optimization, numerical optimization, and numerical linear algebra for optimization.

      - name: Ernesto G. Birgin
        icon: fa-solid fa-user
        reference: Full Professor at the Department of Computer Science, Institute of Mathematics and Statistics, University of Sao Paulo. Member of the Continuous Optimization group at IME-USP. His research interests include nonlinear programming, optimization, and operations research.

      - name: Paulo J. S. Silva
        icon: fa-solid fa-user
        reference: Full Professor at the Department of Applied Mathematics, Institute of Mathematics, Statistics and Scientific Computing, University of Campinas. His main research area is continuous optimization, particularly convex programming, with additional interests in pattern recognition and support vector machines.
