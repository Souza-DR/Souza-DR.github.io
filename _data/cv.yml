cv:
  name: Danilo R. Souza
  label: Researcher in Mathematical Optimization and Inverse Problems
  email: souzadr@unicamp.br / danilogyn01@gmail.com
  location: Unicamp, Campinas, SP
  image: ""
  summary: Mathematician with B.Sc., M.Sc., and Ph.D. degrees in Mathematics from the Universidade Federal de Goiás (Federal University of Goias) - UFG. My research focuses on continuous optimization, multiobjective optimization, derivative-free methods, inverse problems, and large-scale stochastic optimization for Full Waveform Inversion. I develop scientific software mainly in Julia, with interests in numerical methods, computational geophysics, high-performance computing, and multi-language scientific computing pipelines.

